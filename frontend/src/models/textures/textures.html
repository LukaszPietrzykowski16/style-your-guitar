<div class="colors-container">

      </svg>
      <span style="background-color: transparent">Upload Texture</span>

<div class="sticker-config-container">
  <span
    style="
      font-size: 18px;
      text-align: left;
      width: 100%;
      text-align: left;
      padding-top: 8px;
      padding-left: 16px;
      display: flex;
    "
  >
    Texture Controls
  </span>
  <div id="texture-config" class="sticker-container">
    <div style="display: flex; gap: 10px">
      <div>
        <p>Roughness</p>
        <input
          type="range"
          min="0"
          max="2"
          step="0.01"
          value=""
          id="roughness"
        />
      </div>
      <div>
        <p>Metalness</p>
        <input
          type="range"
          min="0"
          max="2"
          step="0.01"
          value=""
          id="metalness"
        />
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div>
        <p>Rotate</p>
        <input type="range" min="0" max="360" step="1" value="0" id="rotate" />
      </div>
      <div>
        <p>Zoom in / Zoom out</p>
        <input
          type="range"
          min="0.0"
          max="2.0"
          step="0.01"
          value="1.0"
          id="zoom"
        />
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div>
        <p>MoveX</p>
        <input
          type="range"
          min="0"
          max="1"
          step="0.001"
          value="0.5"
          id="moveX"
        />
      </div>
      <div>
        <p>MoveY</p>
        <input
          type="range"
          min="0"
          max="1"
          step="0.001"
          value="0.5"
          id="moveY"
        />
      </div>
    </div>
  </div>
</div>
